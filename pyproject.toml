[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillcheck"
version = "0.1.0"
description = "Local-first Skill inventory, audit, and preflight checker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6", "mypy>=1.11", "build>=1.2,<2"]

[project.scripts]
skillcheck = "skillcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skillcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
