[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillcheck"
version = "0.4.1"
description = "Personal Skill governance with Agent-native semantic review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
  "tomlkit>=0.13,<1",
  "mcp>=1,<2",
  "jsonschema>=4,<5",
  "watchfiles>=1,<2",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6,<7", "build>=1.2,<2", "pyinstaller>=6,<7"]

[project.scripts]
skillcheck = "skillcheck.app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skillcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008"]
