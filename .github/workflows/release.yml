name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/release -q
      - name: Build release metadata
        run: python scripts/render_manifest.py README.md --version "${GITHUB_REF_NAME#v}" --output release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*

